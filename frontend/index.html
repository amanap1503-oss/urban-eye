<!DOCTYPE html>
<html lang="en">

<head>
  <meta name="google-site-verification" content="JPvoAN2gTeYbOE0wUaLiciFx4OJK9Ic4k6as8EcuLvc" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Urban Eye</title>
  <meta name="description"
    content="Empowers communities to report civic issues, track progress, and engage in collaborative governance through an interactive smart city dashboard." />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.x/tabler-icons.min.css" />
  <style>
    html,
    body {
      height: 100%;
      margin: 0;
    }

    #root {
      height: 100%;
    }
  </style>

  <!-- Restore the persisted theme before first paint (no flash on refresh) -->
  <script>
    (function () {
      try {
        if (localStorage.getItem("urbanEyeTheme") === "blue-steel") {
          document.documentElement.classList.add("theme-blue-steel");
        }
        var lang = localStorage.getItem("urbanEyeLanguage");
        if (lang) document.documentElement.lang = lang;
      } catch (e) {}
    })();
  </script>

</head>

<body>

  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>

</body>

</html>
